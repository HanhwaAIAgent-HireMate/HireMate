[project]
name = "hiremate-ai"
version = "0.1.0"
description = "HireMate AI 서버 (AI API, AI 워커)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
