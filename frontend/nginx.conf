server {
    listen 80;
    server_name hiremate.yuumin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hiremate.yuumin.com;
    ssl_certificate /etc/letsencrypt/live/hiremate.yuumin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiremate.yuumin.com/privkey.pem;
    root /usr/share/nginx/html;
    client_max_body_size 70m;

    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /mailpit {
        return 301 /mailpit/;
    }

    # 운영 Mailpit 메일함. 로그인은 Mailpit이 확인한다
    location /mailpit/ {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
