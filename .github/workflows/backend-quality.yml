name: backend-quality

on:
  pull_request:
  # PR에서 통과한 코드는 main에서 다시 검사하지 않는다. 의존성이 바뀐 채 머지되면 한 번 돌려 PR이 받아 쓸 캐시를 만든다.
  push:
    branches: [main]
    paths:
      - backend/*.gradle
      - backend/gradle/wrapper/gradle-wrapper.properties

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend 품질 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 검사 대상 확인
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          required=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            required=true
          else
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                backend/*|.github/workflows/backend-quality.yml|contract/*) required=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Checkstyle 및 테스트
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew --no-daemon check
