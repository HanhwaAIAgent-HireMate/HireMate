name: ai-quality

on:
  pull_request:
    paths:
      - ai/**
      - contract/**
      - .github/workflows/ai-quality.yml
  # PR에서 통과한 코드는 main에서 다시 검사하지 않는다. 의존성이 바뀐 채 머지되면 한 번 돌려 PR이 받아 쓸 캐시를 만든다.
  push:
    branches: [main]
    paths:
      - ai/uv.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: ai 품질 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: ai
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python 설치
        run: uv python install
      - name: 의존성 설치
        run: uv sync --locked
      - name: Ruff 린트
        run: uv run --locked ruff check
      - name: Ruff 포맷
        run: uv run --locked ruff format --check
      - name: mypy 타입 검사
        run: uv run --locked mypy
      - name: pytest
        run: uv run --locked pytest
