name: demo baseline

# 운영 데이터를 기준점으로 되돌리거나(restore) 지금 상태를 새 기준점으로 뜬다(snapshot).
# Actions 탭 → demo baseline → Run workflow. 운영 DB를 통째로 바꾸므로 confirm에 action과 같은 낱말을 적어야 실행한다.
# 내용은 scripts/demo/baseline.sh, 쓰는 법은 scripts/demo/README.md의 '운영 기준점'에 있다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "restore = 기준점으로 되돌리기, snapshot = 지금 상태를 새 기준점으로, status = 기준점 목록"
        type: choice
        options: [restore, snapshot, status]
        default: restore
      confirm:
        description: "확인: 위 action과 같은 낱말을 적는다 (예: restore)"
        required: true

permissions:
  contents: read

# 배포와 동시에 돌지 않게 배포와 같은 묶음을 쓴다
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, hiremate-production]
    timeout-minutes: 15
    steps:
      - name: 확인 문구 검사
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ACTION" ]; then
            echo "::error::confirm에 '$ACTION'을 적어야 실행한다"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 기준점 ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
        run: bash scripts/demo/baseline.sh "$ACTION"

      # 취소되거나 시간 제한에 걸리면 위 단계의 스크립트는 서비스를 다시 띄우지 못하고 DB 작업도 남는다.
      # 남은 작업을 끝내고 서비스를 다시 띄운다
      - name: 취소 · 실패 뒤 정리
        if: (cancelled() || failure()) && inputs.action != 'status' && inputs.confirm == inputs.action
        run: bash scripts/demo/baseline.sh cleanup
