name: frontend-quality

on:
  pull_request:
  # PR에서 통과한 코드는 main에서 다시 검사하지 않는다. 의존성이 바뀐 채 머지되면 한 번 돌려 PR이 받아 쓸 캐시를 만든다.
  push:
    branches: [main]
    paths:
      - frontend/package-lock.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend 품질 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 검사 대상 확인
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          required=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            required=true
          else
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                frontend/*|.github/workflows/frontend-quality.yml|.editorconfig) required=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: npm ci
      - name: ESLint, Prettier, 테스트 및 빌드
        if: steps.changes.outputs.run == 'true'
        run: npm run check
