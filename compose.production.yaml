name: hiremate

services:
  frontend:
    image: hiremate-frontend:current
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - mailpit
    restart: unless-stopped

  backend:
    image: hiremate-backend:current
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: /opt/hiremate/runtime.env
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SESSION_TIMEOUT: 30m
      HIREMATE_AI_BASE_URL: http://ai:8001
      HIREMATE_FILES_STORAGE: s3
      HIREMATE_DUMMY_ASSESSMENT: "false"
      AWS_REGION: ap-northeast-2
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - /opt/hiremate/rds-ca-bundle.pem:/etc/ssl/certs/rds-ca-bundle.pem:ro
    depends_on:
      - redis
      - ai
      - mailpit
    restart: unless-stopped

  ai:
    image: hiremate-ai:current
    build:
      context: .
      dockerfile: ai/Dockerfile
    env_file: /opt/hiremate/runtime.env
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend:8080
      NCS_EMBED_URL: http://embedding:8002
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/ssl/certs/rds-ca-bundle.pem
    volumes:
      - /opt/hiremate/rds-ca-bundle.pem:/etc/ssl/certs/rds-ca-bundle.pem:ro
      - /opt/hiremate/poster-reference-data:/app/poster-reference-data:ro
    depends_on:
      - redis
      - embedding
    restart: unless-stopped

  worker:
    image: hiremate-ai:current
    command: ["python", "-m", "hiremate_ai.worker"]
    env_file: /opt/hiremate/runtime.env
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend:8080
      NCS_EMBED_URL: http://embedding:8002
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/ssl/certs/rds-ca-bundle.pem
    volumes:
      - /opt/hiremate/rds-ca-bundle.pem:/etc/ssl/certs/rds-ca-bundle.pem:ro
    depends_on:
      - redis
      - embedding
    restart: unless-stopped

  embedding:
    image: hiremate-embedding:current
    build:
      context: .
      dockerfile: ai/Dockerfile
      target: embedding
    env_file: /opt/hiremate/runtime.env
    environment:
      NCS_EMBED_HOST: 0.0.0.0
    volumes:
      - embedding-model-cache:/var/cache/huggingface
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 안내 메일을 실제로 보내지 않고 받아 두는 SMTP 서버(로컬 compose.yaml과 같은 Mailpit).
  # 메일함은 Nginx의 /mailpit/ 경로로만 열고, 로그인 계정은 서버의 htpasswd 파일에 둔다
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_WEBROOT: /mailpit/
      MP_UI_AUTH_FILE: /etc/mailpit/ui-auth
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - type: bind
        source: /opt/hiremate/mailpit-ui-auth
        target: /etc/mailpit/ui-auth
        read_only: true
        bind:
          create_host_path: false
      - mailpit-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  mailpit-data:
  embedding-model-cache:
