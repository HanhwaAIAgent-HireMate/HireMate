# 서류 평가 데이터셋(scripts/demo/applicants.json · answer-key.json)용 평가 기준. SPRING_PROFILES_ACTIVE=fixtures로 띄우면
# 기본 더미 평가 기준(application.yml) 대신 이 기준을 모든 채용에 쓴다. 항목은 정답표의 중점 평가 항목 5종과 같다.
# 모두 경험형(COMPOSITE)이라 표에서 충족 + 정량 지표는 상, 충족 · 부분 충족은 중, 미충족은 하, 근거 부족은 확인 필요다.
# 미충족은 서류에 참여하지 않았다고 적힌 경우이고, 본인 담당 범위가 드러나지 않으면 확인 필요다.
# 지원자마다 중점 경험이 하나라 필수(중요 자격요건) 항목은 두지 않는다. text는 scripts/demo/seed.py의 공고 본문과 같다
hiremate:
  dummy:
    screening-rubric:
      criteria-version: fixtures-2026-11-03
      hire-count: 1
      criteria:
        - criterion-id: Q-01
          category: QUALIFICATION
          text: REST API를 개발하고 운영한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: REST API를 본인이 구현하고, 운영 중 오류 확인 · 성능 개선 같은 운영까지 직접 했다.
            partial: API 구현과 운영 가운데 하나만 본인이 했다.
            unmet: API 명세 검토 · 요청 전달만 했고 구현과 운영에는 참여하지 않았다고 서류에 적혀 있다.
        - criterion-id: Q-02
          category: QUALIFICATION
          text: SQL을 작성하고 DB 성능을 개선한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: SQL을 본인이 작성 · 수정하고, 실행계획 비교 · 인덱스 구성 같은 DB 성능 개선까지 직접 했다.
            partial: SQL 작성 · 수정과 DB 성능 개선 가운데 하나만 본인이 했다.
            unmet: 조회 조건 전달 등만 했고 SQL 작성이나 DB 개선에는 참여하지 않았다고 서류에 적혀 있다.
        - criterion-id: P-01
          category: PREFERENCE
          text: 외부 시스템 연동을 설계하고 구현한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: 송수신 명세 · 오류 응답 형식 같은 연동 설계를 본인이 하고, 호출 코드와 재시도 같은 오류 처리까지 구현했다.
            partial: 연동 설계와 구현 가운데 하나만 본인이 했다.
            unmet: 연동 기능을 쓰기만 했거나 연동 설계 · 구현에 참여하지 않았다고 서류에 적혀 있다.
        - criterion-id: P-02
          category: PREFERENCE
          text: 장애 원인을 분석하고 복구한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: 운영 로그 · 지표로 장애 원인을 본인이 찾고, 우회 조치 · 복구 검증 같은 복구까지 직접 했다.
            partial: 장애 원인 분석과 복구 가운데 하나만 본인이 했다.
            unmet: 장애 상황 공유 · 전달만 했고 원인 분석과 복구에는 참여하지 않았다고 서류에 적혀 있다.
        - criterion-id: P-03
          category: PREFERENCE
          text: 빌드 · 배포 자동화(CI/CD)를 구성한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: 빌드 · 배포 파이프라인을 본인이 구성하고 그 파이프라인으로 운영 배포를 했다.
            partial: 빌드 · 테스트 단계 같은 파이프라인 일부만 본인이 구성했다.
            unmet: 이미 있는 파이프라인을 실행하기만 했고 빌드 · 배포 설정은 구성하지 않았다고 서류에 적혀 있다.
