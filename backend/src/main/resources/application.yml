spring:
  application:
    name: hiremate-backend
  docker:
    compose:
      # 로컬 실행 시 저장소 루트의 compose.yaml(PostgreSQL, Redis)을 띄우고, 앱을 꺼도 컨테이너는 남긴다
      file: ../compose.yaml
      lifecycle-management: start-only
  session:
    timeout: 30m
    data:
      redis:
        namespace: hiremate:sessions
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 70MB
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로만 바꾼다
      ddl-auto: validate

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info

hiremate:
  mail:
    from: ${MAIL_FROM:no-reply@hiremate.local}
  ai:
    # stub: backend 안의 개발용 응답, remote: ai 서버(ai/) 호출
    mode: ${HIREMATE_AI_MODE:stub}
    base-url: ${HIREMATE_AI_BASE_URL:http://localhost:8001}
  files:
    # 로컬 개발용 파일 저장 위치. 운영은 비공개 S3를 쓴다
    local-dir: ${HIREMATE_FILES_DIR:${user.home}/.hiremate/files}
