spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: hiremate-backend
  docker:
    compose:
      # 로컬 실행 시 저장소 루트의 compose.yaml(PostgreSQL, Redis)을 띄우고, 앱을 꺼도 컨테이너는 남긴다
      file: ../compose.yaml
      lifecycle-management: start-only
  session:
    # 개발 편의를 위해 로그인 세션을 하루 동안 유지한다 (마지막 요청 기준)
    timeout: 1d
    data:
      redis:
        namespace: hiremate:sessions
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 70MB
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로만 바꾼다
      ddl-auto: validate

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    mail:
      # 메일 서버 장애로 앱 전체를 DOWN으로 보지 않는다. 발송 실패는 건별로 기록하고 다시 보낼 수 있다
      enabled: false

hiremate:
  mail:
    from: ${MAIL_FROM:no-reply@hiremate.local}
  ai:
    # stub: backend 안의 개발용 응답, remote: ai 서버(ai/) 호출
    mode: ${HIREMATE_AI_MODE:stub}
    # Agent별로 mode를 덮어쓰려면 hiremate.ai.agents.{key}를 준다 (환경 변수 예: HIREMATE_AI_AGENTS_ROOT=remote)
    # key: root, application, candidate-analyst, assessment, interview, interview-analyst, profile, posting, communication, report
    base-url: ${HIREMATE_AI_BASE_URL:http://localhost:8001}
    # ai 서버 응답을 기다리는 시간. LLM 호출이 길어질 수 있다
    # 지원 접수 분석(Application Agent)은 기다리지 않고 분석 작업 대기열(hiremate.jobs)로 AI 워커에 맡긴다
    timeout: ${HIREMATE_AI_TIMEOUT:60s}
  jobs:
    # AI 워커(ai/)와 주고받는 Redis 스트림. ai 설정의 WORKER_JOB_STREAM, WORKER_RESULT_STREAM과 같아야 한다
    stream: hiremate:jobs
    result-stream: hiremate:job-results
    # 결과를 읽는 소비자 그룹과 이 서버의 이름. backend를 여러 대 띄우면 서버마다 consumer를 다르게 준다
    group: backend
    consumer: ${HOSTNAME:backend}
    # 결과 스트림을 읽는 간격과, 기록하지 못하고 남은 결과를 다시 읽는 간격
    poll-interval: 1s
    retry-interval: 1m
    # 분석 중인 지원서가 이 시간이 지나도록 대기열에 없으면(Redis를 비웠거나 넣지 못했으면) 다시 넣는다
    recover-after: 10m
  report:
    # 서류 전형 분포 리포트. 경계 기준은 팀과 정하기 전의 임시값이다
    distribution:
      # 서류 통과 목표 인원 기본값 = 공고 채용 인원 × 이 배수. 화면에서 바꿀 수 있고 저장하지 않는다
      target-multiplier: 10
      # 선 아래에서 다시 볼 사람: 충족하지 못했거나 확인이 필요한 필수 조건이 이 개수 이하
      max-missing-required: 1
      # 심층 분석 한 번에 보는 인원 (비교 리포트 최대 인원과 같다)
      deep-size: 5
  dummy:
    # 평가 전형 결과 더미 (resources/dummy/assessment-results.csv, 데모 시드의 가상 지원자 30명).
    # 앞 전형을 종료해 평가 전형이 시작되면 넘어온 합격자 모두에게 넣는다. 표에 이메일이 있으면 그 값, 없으면 지원서 ID로 만든 점수.
    # 외부 평가 업체 연동(API)이 생기거나 시연이 아닐 때는 false로 둔다
    assessment-results:
      enabled: ${HIREMATE_DUMMY_ASSESSMENT:true}
    # 서류 평가 기준 더미. 공고 작성 화면에서 평가 기준을 입력하고 확정하기 전까지 모든 채용에 쓴다.
    # text는 공고 본문의 자격요건 · 우대사항과 같아야 짝이 맞는다. important(중요 표시) · criterion-type은 사람이 정하고
    # Agent는 바꾸지 않는다. 서류 점수에서는 important와 상관없이 영역 안의 항목이 모두 같은 비중이다. criterion-type: CONDITION(조건형 0 · 1) · SINGLE(단일 능력 · 경험형 0 · 1) ·
    # COMPOSITE(복합 경험형 0 · 0.5 · 1). 판정 기준은 사람이 확정하기 전의 초안이다.
    # certificates가 있으면 자격증 보유 조건으로 코드가 이름을 확인한다
    screening-rubric:
      criteria-version: dummy-2026-10-22
      hire-count: 1
      criteria:
        - criterion-id: Q-01
          category: QUALIFICATION
          text: Java 또는 Kotlin 기반 서버 개발 경력 3년 이상
          important: true
          criterion-type: CONDITION
          evaluation-rules:
            met: Java · Kotlin으로 서버를 개발한 재직 경력이 3년 이상이다 (기간은 경력표로 계산한다).
            unmet: Java · Kotlin 서버 개발 재직 경력이 3년에 못 미치거나 서류에서 확인되지 않는다.
        - criterion-id: Q-02
          category: QUALIFICATION
          text: Spring Boot로 REST API를 개발 · 운영한 경험
          important: true
          criterion-type: SINGLE
          evaluation-rules:
            met: Spring Boot로 REST API를 본인이 개발하거나 운영했다.
            unmet: Spring Boot로 REST API를 개발 · 운영한 기록이 서류에서 확인되지 않는다.
        - criterion-id: Q-03
          category: QUALIFICATION
          text: MySQL · PostgreSQL 등 RDBMS 스키마 설계와 SQL 작성 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: RDBMS 스키마(테이블 · 인덱스)를 본인이 설계하고 SQL을 작성했다.
            partial: SQL 작성이나 쿼리 튜닝은 했지만 스키마 설계는 드러나지 않는다 (또는 그 반대).
            unmet: RDBMS를 다룬 기록이 서류에서 확인되지 않는다.
        - criterion-id: Q-04
          category: QUALIFICATION
          text: Git 기반 코드 리뷰와 협업 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: Git으로 협업하며 코드 리뷰(PR 리뷰 등)를 주고받았다.
            partial: Git으로 협업한 기록은 있지만 코드 리뷰는 드러나지 않는다.
            unmet: Git 협업 기록이 서류에서 확인되지 않는다.
        - criterion-id: Q-05
          category: QUALIFICATION
          text: JUnit 등으로 테스트 코드를 작성한 경험
          important: false
          criterion-type: SINGLE
          evaluation-rules:
            met: JUnit 등 테스트 도구로 테스트 코드를 본인이 작성했다.
            unmet: 테스트 코드를 작성한 기록이 서류에서 확인되지 않는다.
        - criterion-id: P-01
          category: PREFERENCE
          text: 외부 시스템 연동 인터페이스를 설계한 경험
          important: true
          criterion-type: COMPOSITE
          evaluation-rules:
            met: >-
              외부 · 내부 시스템 간 연동 인터페이스를 본인이 설계했다. 연동 대상과 송수신 데이터를 정하고,
              송수신 방식(API · 메시지 명세)과 오류 시 처리 방안까지 명세한 근거가 있다.
            partial: >-
              인터페이스 설계의 일부만 본인이 했다. 연동 대상 · 송수신 데이터를 정하거나 API 명세를 썼지만
              오류 시 처리 방안까지는 드러나지 않는다.
            unmet: 연동 기능을 쓰거나 구현만 했고 설계한 기록이 서류에서 확인되지 않는다.
        - criterion-id: P-02
          category: PREFERENCE
          text: 연동 API를 구현하고 오류 · 보안 처리를 적용한 경험
          important: true
          criterion-type: COMPOSITE
          evaluation-rules:
            met: >-
              외부 · 내부 모듈과의 연동 기능을 본인이 구현했고, 실패 시 예외 처리(재시도 · 타임아웃 · 보상 처리 등)와
              보안 처리(인증 · 암호화 · 서명 검증 등)를 모두 적용했다.
            partial: 연동 기능을 본인이 구현했고 예외 처리와 보안 처리 가운데 하나만 드러난다.
            unmet: 연동 기능을 구현한 기록이 없거나, 구현했어도 예외 · 보안 처리가 서류에서 확인되지 않는다.
        - criterion-id: P-03
          category: PREFERENCE
          text: 요구사항을 분석 · 확인해 개발 범위를 정한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: >-
              현행 시스템이나 업무 요구사항을 본인이 분석 · 검토해 개발 범위나 목표 시스템을 정했다
              (예: 요구사항 정의서 작성, 범위 협의를 이끎).
            partial: 요구사항 분석 · 검토에 참여해 의견을 냈지만 개발 범위를 정한 데까지는 드러나지 않는다.
            unmet: 정해진 요구사항대로 구현한 기록만 있다.
        - criterion-id: P-04
          category: PREFERENCE
          text: 빌드 · 배포 자동화(CI/CD)를 구성한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: >-
              빌드 · 배포 파이프라인(도구 · 스크립트 · 환경 설정)을 본인이 구성해 운영 환경에 배포했고,
              배포 후 확인이나 실패 시 이전 버전으로 되돌리는 절차까지 있다.
            partial: >-
              빌드 스크립트나 파이프라인 일부(테스트 · 빌드 단계 등)만 본인이 구성했고,
              운영 배포나 복원 절차는 드러나지 않는다.
            unmet: 이미 구성된 파이프라인을 쓴 기록만 있거나 서류에서 확인되지 않는다.
        - criterion-id: P-05
          category: PREFERENCE
          text: 클래스 · 데이터 모델 등 정적 모델을 설계한 경험
          important: false
          criterion-type: COMPOSITE
          evaluation-rules:
            met: 클래스 · 엔티티 · 데이터 모델(ERD 등)을 본인이 상세 설계하고 설계서나 다이어그램으로 남겼다.
            partial: 엔티티 · 테이블 설계를 본인이 했지만 설계서나 다이어그램 같은 결과물은 드러나지 않는다.
            unmet: 정적 모델을 설계한 기록이 서류에서 확인되지 않는다.
  files:
    # 로컬 개발용 파일 저장 위치. 운영은 비공개 S3를 쓴다
    local-dir: ${HIREMATE_FILES_DIR:${user.home}/.hiremate/files}
